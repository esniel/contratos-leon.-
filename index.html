<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEONIX v55</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b11;color:#eef3f8;font-family:Arial,sans-serif}.top{height:58px;border-bottom:1px solid #202936;display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;background:#070b11;z-index:5}.lion{font-size:28px}.brand{font-weight:900;letter-spacing:2px}.ver{font-size:10px;color:#8390a0}.sync{margin-left:auto;color:#25d58a;font-size:12px}.wrap{max-width:1320px;margin:auto;padding:14px}.bar,.card{background:#0d131c;border:1px solid #202936;border-radius:14px}.bar{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar button,.bar select{background:#131c28;color:#dce5ee;border:1px solid #293646;border-radius:9px;padding:9px 12px}.bar button.on{background:#0d63e5;color:white}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;margin-top:12px}.card{padding:14px}.chart{height:480px;position:relative;overflow:hidden}.chart canvas{width:100%;height:100%}.title{font-size:12px;color:#8492a3;text-transform:uppercase;letter-spacing:1px}.price{font-size:30px;font-weight:800;margin:5px 0}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1d2632;padding:11px 0;font-size:13px}.good{color:#2bd990}.bad{color:#ff5c68}.wait{color:#f2c14e}.levels{position:absolute;left:12px;right:12px;top:45px;bottom:15px;pointer-events:none}.level{position:absolute;left:0;right:0;border-top:1px dashed #566; font-size:10px}.level span{float:right;background:#111927;padding:2px 5px}.foot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.metric{padding:13px}.metric b{display:block;font-size:18px;margin-top:5px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chart{height:390px}.foot{grid-template-columns:1fr 1fr}.wrap{padding:9px}.top{padding:0 10px}.price{font-size:25px}}
</style></head><body>
<div class="top"><div class="lion">🦁</div><div><div class="brand">LEONIX</div><div class="ver">v55 · PAPER / SHADOW</div></div><div class="sync" id="sync">● CONECTANDO</div></div>
<div class="wrap"><div class="bar"><button id="stocks" class="on" onclick="market('STOCKS')">ACCIONES</button><button id="crypto" onclick="market('CRYPTO')">CRIPTO</button><select id="symbol" onchange="refresh()"><option>AAPL</option><option>MSFT</option><option>NVDA</option><option>AMZN</option><option>META</option><option>GOOGL</option><option>TSLA</option></select><button onclick="tf='1min';refresh()">1m</button><button onclick="tf='5min';refresh()">5m</button><button onclick="tf='15min';refresh()">15m</button><button onclick="tf='1hour';refresh()">1h</button><button onclick="refresh()">↻ SYNC</button></div>
<div class="grid"><main class="card"><div class="title" id="symtitle">AAPL · GRÁFICO</div><div class="price" id="price">—</div><div class="chart"><canvas id="cv"></canvas><div class="levels" id="levels"></div></div></main>
<aside><div class="card"><div class="title">ROBOT AI</div><div class="row"><span>Estado</span><b id="state" class="wait">WAIT</b></div><div class="row"><span>Mercado</span><b id="rmarket">—</b></div><div class="row"><span>Oportunidad</span><b id="opp">NINGUNA</b></div><div class="row"><span>Motivo</span><span id="reason">Analizando…</span></div></div>
<div class="card" style="margin-top:12px"><div class="title">RISK SHIELD</div><div class="row"><span>Protección</span><b class="good">ACTIVA</b></div><div class="row"><span>Live Trading</span><b class="bad">BLOQUEADO</b></div><div class="row"><span>Modo</span><b>PAPER</b></div></div>
<div class="card" style="margin-top:12px"><div class="title">DATA HEALTH</div><div class="row"><span>Backend</span><b id="health">—</b></div><div class="row"><span>Última actualización</span><span id="updated">—</span></div></div></aside></div>
<div class="foot"><div class="card metric"><span class="title">ENTRY</span><b id="entry">—</b></div><div class="card metric"><span class="title">STOP</span><b id="stop">—</b></div><div class="card metric"><span class="title">TP1</span><b id="tp1">—</b></div><div class="card metric"><span class="title">TP2</span><b id="tp2">—</b></div></div></div>
<script>
let kind='STOCKS',tf='5min'; const $=x=>document.getElementById(x);
async function get(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
function market(m){kind=m;$('stocks').classList.toggle('on',m==='STOCKS');$('crypto').classList.toggle('on',m==='CRYPTO');$('symbol').innerHTML=m==='STOCKS'?'<option>AAPL</option><option>MSFT</option><option>NVDA</option><option>AMZN</option><option>META</option><option>GOOGL</option><option>TSLA</option>':'<option>BTC/USD</option><option>ETH/USD</option><option>SOL/USD</option>';refresh()}
function draw(c){let cv=$('cv'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;let x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);if(!c||c.length<2)return;let vals=c.flatMap(a=>[+a.high||+a.h,+a.low||+a.l]).filter(Number.isFinite),mn=Math.min(...vals),mx=Math.max(...vals),pad=18,yy=v=>pad+(mx-v)/(mx-mn||1)*(h-pad*2),step=(w-pad*2)/c.length;x.strokeStyle='#263241';for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,h*i/5);x.lineTo(w,h*i/5);x.stroke()}c.forEach((a,i)=>{let o=+a.open||+a.o,cl=+a.close||+a.c,hi=+a.high||+a.h,lo=+a.low||+a.l,xx=pad+i*step+step/2;x.strokeStyle=cl>=o?'#29d391':'#ff5964';x.beginPath();x.moveTo(xx,yy(hi));x.lineTo(xx,yy(lo));x.stroke();x.fillStyle=x.strokeStyle;x.fillRect(xx-Math.max(1,step*.28),Math.min(yy(o),yy(cl)),Math.max(2,step*.56),Math.max(1,Math.abs(yy(o)-yy(cl))))})}
function levels(a,p){let t=a.technical||a.indicators||{},sup=+t.support||0,res=+t.resistance||0;$('entry').textContent=p?('$'+p.toFixed(2)):'—';$('stop').textContent=sup?('$'+sup.toFixed(2)):'—';$('tp1').textContent=res?('$'+res.toFixed(2)):'—';$('tp2').textContent=(res&&p)?('$'+(res+(res-p)).toFixed(2)):'—'}
async function refresh(){let s=$('symbol').value;$('symtitle').textContent=s+' · '+tf;try{let q=await get('/api/quote?symbol='+encodeURIComponent(s)),p=+(q.price||q.last||q.close||0);$('price').textContent=p?'$'+p.toFixed(2):'—';let a;try{a=await get('/api/analysis?symbol='+encodeURIComponent(s)+'&tf='+tf)}catch(e){a={}}let candles=a.candles||a.bars||[];if(!candles.length){try{let ch=await get('/api/chart?symbol='+encodeURIComponent(s)+'&tf='+tf);candles=ch.candles||ch.bars||ch.data||[]}catch(e){}}draw(candles);levels(a,p);$('health').textContent='OK';$('health').className='good';$('sync').textContent='● EN VIVO';$('updated').textContent=new Date().toLocaleTimeString()}catch(e){$('health').textContent='ERROR';$('health').className='bad';$('sync').textContent='● DATA ERROR';$('state').textContent='NO TRADE'}}
async function robot(){try{let r=await get('/api/market-selector');let z=r.robot||r;$('state').textContent=z.state||'WAIT';$('rmarket').textContent=r.selected_market||z.market||'—';$('opp').textContent=z.symbol||'NINGUNA';$('reason').textContent=z.reason||z.motivo||'Esperando señal válida'}catch(e){}}
refresh();robot();setInterval(refresh,10000);setInterval(robot,10000);addEventListener('resize',()=>refresh());
</script></body></html>
